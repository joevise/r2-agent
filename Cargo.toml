[workspace]
members = ["crates/r2-core", "crates/r2-cli"]
resolver = "2"

[workspace.package]
version = "0.9.3"
edition = "2021"
license = "MIT"
description = "R2 Agent — Small droid, big jobs. A minimal Rust Agent runtime."

[workspace.dependencies]
# HTTP + 异步
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
async-trait = "0.1"
bytes = "1"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# 日志
tracing = "0.1"
tracing-subscriber = "0.3"

# UUID
uuid = { version = "1", features = ["v4"] }

# 沙箱 rlimits
libc = "0.2"

# Web 服务层（r2 web 子命令）
axum = { version = "0.7", features = ["ws", "multipart"] }

# L3 向量索引（可选，feature gate）
rusqlite = { version = "0.31" }

# strict 级沙箱 seccomp（可选，feature gate；系统需安装 libseccomp-dev）
libseccomp = { version = "0.3" }

# 内部 crate
r2-core = { path = "crates/r2-core" }

# dev
tempfile = "3"

[profile.release]
opt-level = "z"     # 最小体积优化
lto = true          # 链接时优化
strip = true        # 去除调试符号
panic = "abort"     # 减小二进制
